name: daily_pauch
description: "每日打卡 - 支持自定义周期、提醒通知、打卡率统计"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # 路由
  go_router: ^14.6.0

  # 数据库
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # 通知
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

  # 工具
  intl: ^0.20.3
  uuid: ^4.5.1
  collection: ^1.18.0
  dynamic_color: ^1.7.0
  share_plus: ^10.1.3
  file_picker: ^8.1.4
  fl_chart: ^0.69.2
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
